<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Cart - Smart Agri-Connect</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      background: #f7f9fc;
      color: #333;
    }

    header {
      background-color: #3f9142;
      color: #fff;
      padding: 20px;
      text-align: center;
    }

    nav {
      margin-top: 10px;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      margin: 0 12px;
      padding: 8px 12px;
      border-radius: 6px;
    }

    nav a:hover {
      background-color: rgba(255, 255, 255, 0.2);
    }

    .btn {
      background-color: #28a745;
      color: #fff !important;
      padding: 8px 16px;
      border-radius: 5px;
      text-decoration: none;
      transition: background-color 0.3s;
    }

    .btn:hover {
      background-color: #218838;
    }

    main {
      padding: 40px 20px;
    }

    .cart-section {
      max-width: 1000px;
      margin: auto;
      background: #fff;
      padding: 25px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      border-radius: 10px;
    }

    .cart-section h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }

    th, td {
      padding: 12px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    th {
      background-color: #e9f5ec;
    }

    input[type="number"] {
      width: 60px;
      padding: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    button {
      background-color: #dc3545;
      color: white;
      padding: 6px 12px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #c82333;
    }

    #totalAmount {
      font-size: 1.3em;
      font-weight: bold;
      text-align: right;
      margin-top: 10px;
    }

    footer {
      background-color: #3f9142;
      color: #fff;
      text-align: center;
      padding: 12px;
      margin-top: 40px;
    }

    @media (max-width: 600px) {
      th, td {
        font-size: 14px;
        padding: 8px;
      }

      input[type="number"] {
        width: 45px;
      }

      .btn {
        font-size: 14px;
        padding: 6px 10px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Smart Agri-Connect</h1>
    <nav>
      <a href="marketplace.html">Marketplace</a>
    </nav>
  </header>

  <main>
    <section class="cart-section">
      <h2>Your Cart</h2>
      <table id="cartTable">
        <thead>
          <tr>
            <th>Product</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Total</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          
        </tbody>
      </table>
      <p id="totalAmount">Total: ₹0</p>
      <a href="payment.html" class="btn">Proceed to Checkout</a>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Smart Agri-Connect. All rights reserved.</p>
  </footer>

  <script>
    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    function renderCart() {
      const cartTable = document.getElementById("cartTable").getElementsByTagName('tbody')[0];
      cartTable.innerHTML = '';

      let totalAmount = 0;
      
      cart.forEach((item, index) => {
        const row = cartTable.insertRow();
        
        row.innerHTML = `
          <td>${item.name}</td>
          <td>₹${item.price}</td>
          <td><input type="number" value="${item.quantity}" min="1" onchange="updateQuantity(${index}, this.value)" /></td>
          <td>₹${item.total}</td>
          <td><button onclick="removeItem(${index})">Remove</button></td>
        `;
        
        totalAmount += item.total;
      });
      
      document.getElementById('totalAmount').textContent = `Total: ₹${totalAmount}`;
    }

    function updateQuantity(index, quantity) {
      if (quantity <= 0 || isNaN(quantity)) return;

      cart[index].quantity = parseInt(quantity);
      cart[index].total = cart[index].price * cart[index].quantity;
      
      localStorage.setItem("cart", JSON.stringify(cart));
      renderCart();
    }

    function removeItem(index) {
      cart.splice(index, 1);
      localStorage.setItem("cart", JSON.stringify(cart));
      renderCart();
    }

    renderCart();
  </script>
</body>
</html>
